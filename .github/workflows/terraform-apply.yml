name: Terraform Apply (Manual)

on:
  workflow_dispatch:

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: Production
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/terraform-sa.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Write service account JSON
        run: |
          cat <<EOF > ${{ github.workspace }}/terraform-sa.json
          ${{ secrets.TERRAFORM_SA }}
          EOF

      - name: Create tfvars file
        run: |
          cat <<EOF > ${{ github.workspace }}/terraform/secrets.tfvars
          project                       = "${{ secrets.PROJECT_ID }}"
          region                        = "${{ secrets.REGION }}"
          db_url_movie_theater_settings = "${{ secrets.DB_URL_MOVIE_THEATER_SETTINGS }}"
          EOF

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform Apply
        run: terraform apply "tfplan"
        working-directory: terraform
